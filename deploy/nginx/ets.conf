# ETS — nginx site. Installed to /etc/nginx/sites-available/ets by deploy/install.sh
# __SERVER_NAME__ and the certificate paths are filled in by the installer.

limit_req_zone $binary_remote_addr zone=ets_login:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name __SERVER_NAME__;
    # Everything goes to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name __SERVER_NAME__;

    ssl_certificate     __SSL_CERT__;
    ssl_certificate_key __SSL_KEY__;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    access_log /var/log/nginx/ets.access.log;
    error_log  /var/log/nginx/ets.error.log;

    client_max_body_size 6m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /opt/ets/frontend/dist;
    index index.html;

    # API → Node.js backend
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location = /api/auth/login {
        limit_req zone=ets_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed static assets: cache for a long time
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single-page app: every other path serves index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}

# ETS — security headers, installed to /etc/nginx/snippets/ets-headers.conf by deploy/install.sh.
# nginx drops every add_header of the server block in a location that has its own add_header,
# so this file is included in the server block AND in every location that adds a header.
# The Content-Security-Policy mirrors the one helmet sends with the API responses (backend/src/app.js);
# /api/* responses carry helmet's CSP, X-Frame-Options and nosniff themselves.
#
# HSTS (finding I4): this plain max-age is the safe default. HSTS is ignored by browsers on IP / self-signed hosts,
# so it only matters on a public domain. For a PUBLIC-DOMAIN deployment where every sub-domain is served over HTTPS,
# strengthen it to:  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;  and, only
# once you are certain and ready for the (hard-to-reverse) commitment, add "; preload" and submit to hstspreload.org.
# Do NOT add includeSubDomains if any sub-domain is still served over plain HTTP — it would force HTTPS on them.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; upgrade-insecure-requests" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

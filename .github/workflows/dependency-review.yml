name: Dependency Review

# On every PR, flags dependencies being added/updated that carry a known vulnerability or a disallowed licence,
# before they are merged. Complements Dependabot (which proposes fixes for what is already in the tree).
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    name: Review PR dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency review
        # Requires the repo's Dependency Graph feature (Settings → Code security and analysis). Until an admin
        # enables it the action errors with "Dependency review is not supported on this repository", so keep this
        # non-blocking for now; once the graph is on, drop continue-on-error so high-severity findings block PRs.
        continue-on-error: true
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

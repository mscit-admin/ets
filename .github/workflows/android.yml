name: Android (ETS Alerts)

on:
  push:
    branches: ["**"]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    # Path filters are not evaluated for tag pushes, so every android-v* tag builds.
    tags: ["android-v*"]
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Build, test, lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    env:
      # Secrets cannot be used in `if:` directly; expose only whether signing is configured.
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
    outputs:
      signed: ${{ steps.release_flag.outputs.signed }}
      version_name: ${{ steps.version.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle.kts
            android/app/*.gradle.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Compute version
        id: version
        shell: bash
        run: |
          # android-v1.2.3 -> versionName 1.2.3, versionCode 10203. Otherwise 1.0.0 / 1.
          name="1.0.0"; code="1"
          if [[ "${GITHUB_REF}" == refs/tags/android-v* ]]; then
            name="${GITHUB_REF#refs/tags/android-v}"
            if [[ "$name" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              code=$(( 10#${BASH_REMATCH[1]} * 10000 + 10#${BASH_REMATCH[2]} * 100 + 10#${BASH_REMATCH[3]} ))
            else
              echo "::error::Tag must look like android-v1.2.3 (got ${GITHUB_REF#refs/tags/})"
              exit 1
            fi
          fi
          echo "ETS_VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "ETS_VERSION_CODE=$code" >> "$GITHUB_ENV"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "Version $name ($code)"

      - name: Build debug APK, unit tests, lint
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug testDebugUnitTest lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ets-alerts-debug-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ets-alerts-reports-${{ github.sha }}
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Fail tag build without signing secrets
        if: startsWith(github.ref, 'refs/tags/android-v') && env.HAS_SIGNING != 'true'
        run: |
          echo "::error::Release tags need ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD secrets."
          exit 1

      - name: Build signed release APK
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/ets-release.jks"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
          ./gradlew --no-daemon --stacktrace assembleRelease
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk" || { echo "::error::Signed release APK not found"; exit 1; }
          mkdir -p "$RUNNER_TEMP/release"
          cp "$apk" "$RUNNER_TEMP/release/ets-alerts-${ETS_VERSION_NAME}.apk"
          (cd "$RUNNER_TEMP/release" && sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Upload release APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ets-alerts-release-${{ steps.version.outputs.name }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/*.apk
            ${{ runner.temp }}/release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90

      - name: Record signing state
        id: release_flag
        run: echo "signed=${HAS_SIGNING}" >> "$GITHUB_OUTPUT"

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/android-v') && needs.build.outputs.signed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: ets-alerts-release-${{ needs.build.outputs.version_name }}-${{ github.sha }}
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ETS Alerts ${{ needs.build.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ETS Alerts (تنبيهات ETS) ${{ needs.build.outputs.version_name }}

            Install `ets-alerts-${{ needs.build.outputs.version_name }}.apk` on Android 8.0+.
            See android/README.md and android/CHANGELOG.md.
          files: |
            release/*.apk
            release/SHA256SUMS.txt
          fail_on_unmatched_files: true

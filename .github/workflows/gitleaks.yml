name: gitleaks (secret scan)

# Scans the working tree AND the full commit history for committed secrets (keys, tokens, credentials). Uses the
# gitleaks binary directly (no org licence required, unlike the gitleaks GitHub Action). Fails the run on a leak.
on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "13 4 * * 1" # weekly, Monday — jittered minute
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Detect secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks version
      - name: Scan history
        run: ./gitleaks git . --redact --no-banner --exit-code 1
      - name: Scan working tree
        run: ./gitleaks dir . --redact --no-banner --exit-code 1
